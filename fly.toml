# fly.toml app configuration file generated for tarneeb-trix-server on 2026-09-06T11:24:13+04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tarneeb-trix-server'
primary_region = 'fra'

[build]
  dockerfile = 'apps/server/Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
